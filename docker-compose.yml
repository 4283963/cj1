version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx:5.6
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    environment:
      EMQX_NODE__COOKIE: emqx_secret_cookie
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-collector:
    build:
      context: ./go-collector
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: charging
      MQTT_BROKER: tcp://emqx:1883
      MQTT_USER: admin
      MQTT_PASS: public
      STATION_ID: station-001
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy

  java-scheduler:
    build:
      context: ./java-scheduler
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/charging
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SCHEDULER_DEFAULT_MAX_TOTAL_POWER_KW: 1000
      COLLECTOR_URL: http://go-collector:8081
    depends_on:
      postgres:
        condition: service_healthy
      go-collector:
        condition: service_started

  vue-dashboard:
    build:
      context: ./vue-dashboard
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - java-scheduler

volumes:
  postgres_data:
  emqx_data:
